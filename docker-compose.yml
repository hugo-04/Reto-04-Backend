# Levanta únicamente la base de datos MySQL para desarrollo local.
# Las variables se leen del archivo .env (copiar desde .env.example).
# Uso:  docker compose up -d
services:
  mysql:
    image: mysql:8.4
    container_name: customers-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_pass}
      MYSQL_DATABASE: ${DB_NAME:-customers_db}
      MYSQL_USER: ${DB_USER:-customers_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-customers_pass}
      TZ: UTC
    ports:
      # Puerto del equipo -> puerto interno de MySQL (3306)
      - "${DB_PORT:-3307}:3306"
    volumes:
      # Los datos persisten aunque se elimine el contenedor
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
