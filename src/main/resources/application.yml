spring:
  application:
    name: customers-service
  datasource:
    # Los valores por defecto coinciden con .env.example y docker-compose.yml
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:customers_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USER:customers_user}
    password: ${DB_PASSWORD:customers_pass}
  jpa:
    # update: crea las tablas si no existen; si ya existen no las vuelve a crear
    # (solo agrega lo que falte, nunca borra datos)
    hibernate:
      ddl-auto: update
    open-in-view: false

server:
  port: ${SERVER_PORT:8080}

app:
  cors:
    # Orígenes permitidos separados por coma (frontend en desarrollo)
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
